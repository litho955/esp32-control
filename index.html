<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>ESP32 远程控制</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #1a1a2e;
        color: #eee;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px;
        -webkit-tap-highlight-color: transparent;
      }

      h1 {
        font-size: 22px;
        margin-bottom: 4px;
        color: #e94560;
      }

      .status-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 20px;
        font-size: 13px;
        color: #888;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }
      .dot.connected {
        background: #00e676;
        box-shadow: 0 0 8px #00e676;
      }
      .dot.disconnected {
        background: #ff5252;
      }

      .card {
        background: #16213e;
        border-radius: 16px;
        padding: 20px;
        width: 100%;
        max-width: 380px;
        margin-bottom: 16px;
      }

      .card h3 {
        font-size: 15px;
        margin-bottom: 12px;
        color: #aaa;
        border-bottom: 1px solid #0f3460;
        padding-bottom: 8px;
      }

      .btn-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      button {
        flex: 1;
        min-width: 80px;
        padding: 16px 12px;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.1s,
          opacity 0.15s;
        color: #fff;
      }
      button:active {
        transform: scale(0.95);
      }
      button:disabled {
        opacity: 0.4;
        pointer-events: none;
      }

      .btn-on {
        background: linear-gradient(135deg, #00b894, #00e676);
      }
      .btn-off {
        background: linear-gradient(135deg, #e17055, #ff5252);
      }
      .btn-toggle {
        background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      }
      .btn-status {
        background: linear-gradient(135deg, #0984e3, #74b9ff);
        margin-top: 8px;
        width: 100%;
      }
      .btn-all {
        background: linear-gradient(135deg, #fdcb6e, #ffeaa7);
        color: #2d3436;
      }

      .state {
        font-size: 13px;
        color: #888;
        margin-top: 10px;
        padding: 8px 12px;
        background: #0f3460;
        border-radius: 8px;
        min-height: 20px;
        word-break: break-all;
      }
      .state .on {
        color: #00e676;
      }
      .state .off {
        color: #ff5252;
      }

      .footer {
        margin-top: auto;
        padding: 16px;
        font-size: 11px;
        color: #555;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>ESP32 远程控制</h1>

    <div class="status-bar">
      <span class="dot disconnected" id="dot"></span>
      <span id="connText">连接中...</span>
    </div>

    <div class="card">
      <h3>板载 LED (GPIO2)</h3>
      <div class="btn-row">
        <button class="btn-on" onclick="send('LED_ON')">打开</button>
        <button class="btn-off" onclick="send('LED_OFF')">关闭</button>
        <button class="btn-toggle" onclick="send('LED_TOGGLE')">翻转</button>
      </div>
      <div class="state" id="ledState">等待数据...</div>
    </div>

    <div class="card">
      <h3>继电器 1 (GPIO16)</h3>
      <div class="btn-row">
        <button class="btn-on" onclick="send('RELAY1_ON')">打开</button>
        <button class="btn-off" onclick="send('RELAY1_OFF')">关闭</button>
      </div>
      <div class="state" id="relay1State">等待数据...</div>
    </div>

    <div class="card">
      <h3>继电器 2 (GPIO17)</h3>
      <div class="btn-row">
        <button class="btn-on" onclick="send('RELAY2_ON')">打开</button>
        <button class="btn-off" onclick="send('RELAY2_OFF')">关闭</button>
      </div>
      <div class="state" id="relay2State">等待数据...</div>
    </div>

    <div class="card">
      <h3>快捷操作</h3>
      <div class="btn-row">
        <button class="btn-all" onclick="send('ALL_ON')">全部打开</button>
        <button class="btn-all" onclick="send('ALL_OFF')">全部关闭</button>
      </div>
      <button class="btn-status" onclick="send('STATUS')">刷新状态</button>
    </div>

    <div class="footer">通过 MQTT 公网连接 · 无需同局域网</div>

    <script>
      const BROKER = "broker.emqx.io";
      const TOPIC_CONTROL = "home/esp32/control";
      const TOPIC_STATUS = "home/esp32/status";

      const SECURE = location.protocol === "https:";
      const WS_URL = SECURE
        ? `wss://${BROKER}:8084/mqtt`
        : `ws://${BROKER}:8083/mqtt`;

      const dot = document.getElementById("dot");
      const connText = document.getElementById("connText");
      const ledState = document.getElementById("ledState");
      const relay1State = document.getElementById("relay1State");
      const relay2State = document.getElementById("relay2State");

      function setConnected(ok) {
        if (ok) {
          dot.className = "dot connected";
          connText.textContent = "已连接";
        } else {
          dot.className = "dot disconnected";
          connText.textContent = "未连接，重试中...";
        }
      }

      function updateState(data) {
        const s = (v) =>
          v ? '<span class="on">开</span>' : '<span class="off">关</span>';
        if (data.led !== undefined) ledState.innerHTML = "LED: " + s(data.led);
        if (data.relay1 !== undefined)
          relay1State.innerHTML = "继电器1: " + s(data.relay1);
        if (data.relay2 !== undefined)
          relay2State.innerHTML = "继电器2: " + s(data.relay2);
      }

      const client = mqtt.connect(WS_URL, {
        clientId: "web_control_" + Math.random().toString(16).slice(2, 10),
        keepalive: 60,
        clean: true,
      });

      client.on("connect", () => {
        setConnected(true);
        client.subscribe(TOPIC_STATUS, (err) => {
          if (!err) console.log("已订阅状态主题");
        });
        send("STATUS");
      });

      client.on("close", () => setConnected(false));
      client.on("offline", () => setConnected(false));
      client.on("error", () => setConnected(false));
      client.on("reconnect", () => (connText.textContent = "重连中..."));

      client.on("message", (topic, payload) => {
        try {
          const data = JSON.parse(payload.toString());
          updateState(data);
        } catch (e) {
          console.log("收到:", payload.toString());
        }
      });

      function send(cmd) {
        client.publish(TOPIC_CONTROL, cmd, { qos: 1 }, (err) => {
          if (err) {
            alert("发送失败: " + err.message);
          }
        });
      }

      document.addEventListener("DOMContentLoaded", () => {
        setConnected(false);
      });
    </script>
  </body>
</html>
